<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Editor</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="header-left">
          <h1>GitHub Editor</h1>
          <button id="file-selector-btn" class="file-selector-btn" disabled>
            <span id="current-file">No file selected</span>
            <span class="dropdown-arrow">▼</span>
          </button>
        </div>
        <div class="header-right">
          <div class="status" id="status">Loading...</div>
          <button id="settings-btn" class="settings-btn">⚙️</button>
          <button id="save-btn" class="save-btn" disabled>Save</button>
        </div>
      </header>
      <div id="editor" class="editor"></div>
    </div>

    <div id="settings-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <h2>GitHub Settings</h2>
        <form id="settings-form">
          <div class="form-group">
            <label for="repo-input">Repository (owner/repo)</label>
            <input type="text" id="repo-input" placeholder="username/repository" required />
          </div>
          <div class="form-group">
            <label for="token-input">GitHub Token</label>
            <input type="password" id="token-input" placeholder="ghp_..." required />
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
            <button type="submit" class="submit-btn">Save Settings</button>
          </div>
        </form>
      </div>
    </div>

    <div id="file-picker-modal" class="modal" style="display: none;">
      <div class="modal-content file-picker">
        <h2>Select File</h2>
        <div class="search-box">
          <input type="text" id="file-search" placeholder="Search files..." autocomplete="off" />
        </div>
        <div id="file-list" class="file-list">
          <div class="loading-files">Loading files...</div>
        </div>
        <div class="form-actions">
          <button type="button" id="file-cancel-btn" class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
