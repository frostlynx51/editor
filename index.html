<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Editor</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="header-left">
          <h1>GitHub Editor</h1>
          <button id="file-selector-btn" class="file-selector-btn" disabled>
            <span id="current-file">No file selected</span>
            <span class="dropdown-arrow">▼</span>
          </button>
        </div>
        <div class="header-right">
          <div class="save-status">
            <div class="status" id="status">Loading...</div>
            <div class="github-saved-indicator" id="github-saved-indicator">Last saved to GitHub: never</div>
          </div>
          <button id="chat-toggle-btn" class="chat-toggle-btn" disabled>Chat</button>
          <button id="daily-note-btn" class="daily-note-btn" disabled title="Open today's note">📓 Daily Note</button>
          <button id="settings-btn" class="settings-btn">⚙️</button>
          <button id="save-btn" class="save-btn" disabled>Save</button>
        </div>
      </header>
      <div id="editor" class="editor"></div>
      <section id="chat-panel" class="chat-panel collapsed" aria-label="Chat with Gemini">
        <div class="chat-header">
          <div class="chat-title">Chat with Gemini</div>
          <button type="button" id="chat-close-btn" class="chat-close-btn">Hide</button>
        </div>
        <div id="chat-messages" class="chat-messages">
          <div class="chat-empty">Ask about the current note to get started.</div>
        </div>
        <form id="chat-form" class="chat-form">
          <input type="text" id="chat-input" placeholder="Ask about this note..." autocomplete="off" />
          <button type="submit" id="chat-send-btn" class="chat-send-btn">Send</button>
        </form>
      </section>
    </div>

    <div id="settings-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <h2>GitHub Settings</h2>
        <form id="settings-form">
          <div class="form-group">
            <label for="repo-input">Repository (owner/repo)</label>
            <input type="text" id="repo-input" placeholder="username/repository" required />
          </div>
          <div class="form-group">
            <label for="token-input">GitHub Token</label>
            <input type="password" id="token-input" placeholder="ghp_..." required />
          </div>
          <div class="form-group">
            <label for="daily-folder-input">Daily Notes Folder</label>
            <input type="text" id="daily-folder-input" placeholder="Daily Notes" value="Daily Notes" />
            <small style="color: #93a1a1; font-size: 0.85rem; margin-top: 0.25rem; display: block;">Folder path for daily notes</small>
          </div>
          <div class="form-group">
            <label for="daily-format-input">Daily Note Format</label>
            <input type="text" id="daily-format-input" placeholder="YYYY-MM-DD" value="YYYY-MM-DD" />
            <small style="color: #93a1a1; font-size: 0.85rem; margin-top: 0.25rem; display: block;">Use YYYY, MM, DD for date parts</small>
          </div>
          <div class="form-group">
            <label for="gemini-key-input">Gemini API Key</label>
            <input type="password" id="gemini-key-input" placeholder="AIza..." />
            <small style="color: #93a1a1; font-size: 0.85rem; margin-top: 0.25rem; display: block;">Stored locally in your browser</small>
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
            <button type="submit" class="submit-btn">Save Settings</button>
          </div>
        </form>
      </div>
    </div>

    <div id="file-picker-modal" class="modal" style="display: none;">
      <div class="modal-content file-picker">
        <h2>Select File</h2>
        <div class="search-box">
          <input type="text" id="file-search" placeholder="Search files..." autocomplete="off" />
        </div>
        <div id="file-list" class="file-list">
          <div class="loading-files">Loading files...</div>
        </div>
        <div class="form-actions">
          <button type="button" id="file-cancel-btn" class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
